<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="30" />
    <title>اسراء — لحظاتی صبر کنید</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Tahoma, 'Segoe UI', sans-serif; background: #f6f3fb; color: #1c0e44; }
      @media (prefers-color-scheme: dark) { body { background: #140a30; color: #efe9ff; } }
      main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
      h1 { font-size: 1.35rem; margin: 0 0 .75rem; }
      p { line-height: 1.9; margin: 0 0 1.25rem; opacity: .85; }
      .btn { display: inline-block; padding: .7rem 1.4rem; border-radius: .7rem; background: #5b3bd0; color: #fff; text-decoration: none; }
      small { display: block; margin-top: 1rem; opacity: .6; }
    </style>
  </head>
  <body>
    <main>
      <h1>سرویس لحظه‌ای پاسخگو نیست</h1>
      <p>مشکلی از سمت ماست و در حال رفع آن هستیم. اطلاعات شما در امان است. چند لحظه بعد دوباره تلاش کنید؛ صفحه خودکار تازه می‌شود.</p>
      <a class="btn" href="">تلاش دوباره</a>
      <small>اسراء</small>
    </main>
  </body>
</html>
