<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1C0E44" />
    <title>بدون اتصال — اسراء</title>
    <style>
      @font-face {
        font-family: 'Yekan Bakh FaNum';
        src: url('/fonts/YekanBakhFaNum-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Yekan Bakh FaNum';
        src: url('/fonts/YekanBakhFaNum-Bold.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff8f2;
        color: #1c0e44;
        font-family: 'Yekan Bakh FaNum', system-ui, Tahoma, sans-serif;
        line-height: 1.8;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      .ico {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #f6e8dc;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 24px;
        color: #5c5470;
      }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #1c0e44;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ico" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1C0E44" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3l18 18M5.5 9.7a11 11 0 0 1 3-1.7M12 5.5a14 14 0 0 1 8 3M9 13.3a6 6 0 0 1 3-.8M12 18.5h.01" />
        </svg>
      </div>
      <h1>اتصال اینترنت قطع است</h1>
      <p>اسراء برای نمایش جلسات و حساب شما به اینترنت نیاز دارد. اتصال خود را بررسی کنید و دوباره امتحان کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
