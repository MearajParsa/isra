name: Deploy

# استقرار خودکار روی cPanel با SSH پس از ادغام در master (CI قبلاً روی PR اجرا شده است).
# تا وقتی Variable «DEPLOY_ENABLED=true» نباشد هیچ کاری نمی‌کند. راه‌اندازی: docs-v2/25-deploy-cpanel.md بخش «استقرار خودکار».
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      targets:
        description: 'هدف‌ها (فاصله‌جدا): api-low api-mid api-high web-main web-admin'
        default: 'api-low api-mid api-high web-main web-admin'

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production # در Settings ← Environments می‌توانید تأییدکنندهٔ دستی اضافه کنید
    timeout-minutes: 30
    env:
      API_LOW_URL: ${{ vars.API_LOW_URL || 'https://capi.israapp.ir' }}
      API_MID_URL: ${{ vars.API_MID_URL || 'https://oapi.israapp.ir' }}
      API_HIGH_URL: ${{ vars.API_HIGH_URL || 'https://sapi.israapp.ir' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: بیلد کتابخانه‌ها و سرویس‌ها
        run: |
          pnpm turbo build --filter='!@isra/web-main' --filter='!@isra/web-admin'
          pnpm --filter @isra/api-types bundle
          for s in api-low api-mid api-high; do node scripts/pack-service.mjs "$s"; done

      - name: بیلد وب‌ها (آدرس‌های عمومی در بیلد ثبت می‌شوند)
        run: |
          PUBLIC_API_LOW_URL="$API_LOW_URL" PUBLIC_API_MID_URL="$API_MID_URL" pnpm --filter @isra/web-main build
          node scripts/pack-web.mjs
          VITE_API_LOW_URL="$API_LOW_URL" VITE_API_HIGH_URL="$API_HIGH_URL" pnpm --filter @isra/web-admin build

      - name: آماده‌سازی SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_CONTENT: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS_CONTENT" > ~/.ssh/known_hosts

      - name: استقرار
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          APPS_DIR: ${{ vars.APPS_DIR || 'apps' }}
          ADMIN_DOCROOT: ${{ vars.ADMIN_DOCROOT || 'panel.israapp.ir' }}
          NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
          TARGETS: ${{ github.event.inputs.targets || 'api-low api-mid api-high web-main web-admin' }}
          HEALTH_URL_LOW: ${{ env.API_LOW_URL }}/c/health
          HEALTH_URL_MID: ${{ env.API_MID_URL }}/o/health
          HEALTH_URL_HIGH: ${{ env.API_HIGH_URL }}/s/health
        run: |
          export SSH_KEY_FILE="$HOME/.ssh/deploy_key" SSH_KNOWN_HOSTS="$HOME/.ssh/known_hosts"
          bash scripts/deploy-ssh.sh
